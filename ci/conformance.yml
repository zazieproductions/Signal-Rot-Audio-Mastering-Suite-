# Browser conformance + golden regression.
#
# Lives here rather than `.github/workflows/` for the same reason as
# `ci/github-actions-ci.yml`: the automation account may lack the `workflows`
# permission. Installing it is:
#
#     mkdir -p .github/workflows
#     git mv ci/conformance.yml .github/workflows/conformance.yml
#
# See ci/README.md.

name: Conformance lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/audio/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tests/conformance/**'
      - 'tools/**'
      - 'ci/conformance.yml'
  pull_request:
    paths:
      - 'src/audio/**'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tests/conformance/**'
      - 'tools/**'
      - 'ci/conformance.yml'

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    name: Golden fixtures (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate goldens and compare against committed snapshots
        run: |
          npm run lab:goldens
          npx vitest run tests/fixtures/goldens.test.js tests/conformance
      - name: Node benchmarks
        run: npm run lab:bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results-node
          path: lab-results
          retention-days: 14

  browsers:
    name: Web Audio conformance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Conformance suite
        run: npx playwright test --config tests/browser/playwright.config.js --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.browser }}
          path: |
            lab-results
            playwright-report
            test-results
          retention-days: 14
