name: Conformance lab

# ─────────────────────────────────────────────────────────────────────────────────────
# Real-Web-Audio conformance, the goldens, and the Node benchmarks.
#
# Heavy: installs three Playwright browser engines and renders real OfflineAudioContext
# graphs. Only triggered by changes that can actually move the audio behaviour:
# DSP, graph, render, immersive, presets, dependencies, the browser lab itself, or
# the conformance tooling. Documentation-only changes skip this entirely.
#
# Companion to `.github/workflows/ci.yml`, which is the fast always-on gate.
# ─────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/audio/**'
      - 'src/presets/**'
      - 'src/app/parameters.js'
      - 'src/app/constants.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tests/conformance/**'
      - 'tests/dsp/**'
      - 'tests/integration/**'
      - 'tools/**'
      - 'tests/ui/**'
      - 'src/ui/**'
      - 'src/app/bootstrap.js'
      - 'src/app/state.js'
      - 'src/app/presets-io.js'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'src/audio/**'
      - 'src/presets/**'
      - 'src/app/parameters.js'
      - 'src/app/constants.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/browser/**'
      - 'tests/fixtures/**'
      - 'tests/conformance/**'
      - 'tests/dsp/**'
      - 'tests/integration/**'
      - 'tools/**'
      - 'tests/ui/**'
      - 'src/ui/**'
      - 'src/app/bootstrap.js'
      - 'src/app/state.js'
      - 'src/app/presets-io.js'
      - '.github/workflows/conformance.yml'

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    name: Golden fixtures (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `node-web-audio-api` (a devDependency, only loaded by the
      # real-BiquadFilterNode regression lock in `tests/dsp/crossover-real-biquad.test.js`)
      # dlopens `libasound.so.2` at import time. `ubuntu-latest` ships it but the
      # package name differs across releases, so install both candidates.
      - name: Install ALSA (node-web-audio-api native binding)
        run: sudo apt-get update && sudo apt-get install -y libasound2 libasound2t64 || true

      - name: Generate goldens and compare against committed snapshots
        run: |
          npm run lab:goldens
          npx vitest run tests/fixtures/goldens.test.js tests/conformance
      - name: Node benchmarks
        run: npm run lab:bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results-node
          path: lab-results
          retention-days: 14

  browsers:
    name: Web Audio conformance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Warm Vite (pre-transform modules + probe harness URL)
        # Cold-starting Vite against the full lab + production DSP graph on a
        # fresh runner can exceed the 60 s webServer probe budget that
        # Playwright ships with. We start the dev server in the background,
        # poll the harness URL until it answers 200, and shut it back down so
        # Playwright can take over. This both pre-warms Vite's on-disk
        # transform cache and surfaces a clearer failure if the harness can
        # not be served at all.
        run: |
          set -euo pipefail
          npx vite --port 5174 --strictPort --host 0.0.0.0 >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://127.0.0.1:5174/tests/browser/harness.html; then
              echo "vite ready after ${i}s"
              break
            fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then
              echo "::error::vite exited before serving harness.html"
              tail -n 50 /tmp/vite.log
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS -o /dev/null http://127.0.0.1:5174/tests/browser/harness.html; then
            echo "::error::vite did not serve harness.html within 180 s"
            tail -n 50 /tmp/vite.log
            kill "$VITE_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$VITE_PID" 2>/dev/null || true
          wait "$VITE_PID" 2>/dev/null || true
      - name: Conformance suite
        run: npx playwright test --config tests/browser/playwright.config.js --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.browser }}
          path: |
            lab-results
            playwright-report
            test-results
          retention-days: 14
